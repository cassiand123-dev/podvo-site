<!doctype html>
<!-- The layout for the Markdown pages (privacy, terms): the home page's Charcoal look,
     without its motion. index.html and show.html are full pages of their own. -->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1C1C1C">
<title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Podvo">
<meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="https://podvo.co.uk/assets/og.png">
<link rel="icon" href="/share/podvo-logo.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="/share/podvo-icon-48.png" type="image/png" sizes="48x48">
<link rel="icon" href="/share/podvo-icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/share/podvo-icon-192.png">
<link rel="stylesheet" href="/assets/site.css">
</head>
<body>
<header class="top">
  <div class="top-row wrap">
    <a class="brand" href="/" aria-label="Podvo home">
      <img src="/share/podvo-logo.svg" alt="" width="36" height="36">
      <span>Podvo</span>
    </a>
    <a class="btn btn-primary btn-small get" href="https://play.google.com/store/apps/details?id=com.podplay.app">Get the app</a>
  </div>
</header>

<main class="doc wrap">
{{ content }}
</main>

<footer class="foot">
  <div class="wrap">
    <svg class="trace" viewBox="0 0 320 28" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0,14 H118 L128,14 L136,24 L142,4 L152,22 L160,8 L166,14 L176,14 L182,19 L188,9 L194,14 H320"/>
    </svg>
    <div class="foot-row">
      <a class="brand" href="/" aria-label="Podvo home">
        <img src="/share/podvo-logo.svg" alt="" width="32" height="32">
        <span>Podvo</span>
      </a>
      <nav class="foot-links" aria-label="Footer">
        <a href="/privacy/">Privacy</a>
        <a href="/terms/">Terms</a>
        <a href="mailto:cassian.d123@gmail.com">Contact</a>
        <a href="https://play.google.com/store/apps/details?id=com.podplay.app">Google Play</a>
      </nav>
    </div>
    <p class="legal">A podcast app for Android, made in the United Kingdom. © 2026 Podvo.</p>
  </div>
</footer>
</body>
</html>
